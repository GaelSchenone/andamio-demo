# Configuración mínima de Alembic. La conexión a la base NO se define acá: sale de la
# variable de entorno DATABASE_URL (ver alembic/env.py), para que no haya credenciales en el repo.
#
# Uso, desde backend/:
#   uv run alembic upgrade head                              # aplicar migraciones
#   uv run alembic revision --autogenerate -m "descripción"  # crear una nueva
[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
